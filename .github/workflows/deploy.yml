name: Deploy Coding Club to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: |
            KS2 - Scratch 10 week Course/package-lock.json
            KS1 - Pictoblox Course -Blocks - 10 Week/package-lock.json
            KS1 - Pictoblox Course - Junior Blocks - 10 week/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build KS2 Scratch Course (App 1)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd "KS2 - Scratch 10 week Course"
          npm install
          npm run build

      - name: Build KS1 PictoBlox Standard Blocks (App 2)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd "KS1 - Pictoblox Course -Blocks - 10 Week"
          npm install
          npm run build

      - name: Build KS1 PictoBlox Junior Blocks (App 3)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd "KS1 - Pictoblox Course - Junior Blocks - 10 week"
          npm install
          npm run build

      - name: Assemble Deployment Bundle
        run: |
          mkdir -p _site
          cp portal/index.html _site/index.html
          cp -r "KS2 - Scratch 10 week Course/dist" _site/ks2-scratch
          cp -r "KS1 - Pictoblox Course -Blocks - 10 Week/dist" _site/ks1-blocks
          cp -r "KS1 - Pictoblox Course - Junior Blocks - 10 week/dist" _site/ks1-junior

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
